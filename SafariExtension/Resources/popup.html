<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      margin: 0;
      width: 260px;
      font-family: -apple-system, sans-serif;
      background: #f4f2eb;
      color: #222220;
    }
    .wrap { padding: 16px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    p { font-size: 12px; opacity: 0.7; line-height: 1.5; margin: 0; }
    .stato { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .pallino { width: 8px; height: 8px; border-radius: 50%; background: #b84034; }
    .pallino.ok { background: #4c8c5c; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stato"><span class="pallino" id="pallino"></span><h1 id="titolo">Hush</h1></div>
    <p id="testo">Verifico…</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
