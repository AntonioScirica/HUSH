# Specifica XcodeGen per Scrigno.
#
# Uso: installa XcodeGen una volta (`brew install xcodegen`), poi da questa
# cartella lancia `xcodegen generate` per creare Scrigno.xcodeproj, quindi
# aprilo con Xcode. Vedi ISTRUZIONI.md per i passaggi completi, incluso cosa
# personalizzare (Team ID, bundle identifier, App Group).
#
# Info.plist ed entitlements di ogni target sono generati automaticamente da
# XcodeGen a partire dalle sezioni `info:` / `entitlements:` qui sotto — non
# servono file .plist scritti a mano.

name: Scrigno
options:
  bundleIdPrefix: com.antonioscirica
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: "" # <-- inserisci qui il tuo Team ID (Xcode > Signing & Capabilities)
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  VaultCore:
    path: VaultCore

targets:
  Scrigno-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App/Shared
      - path: App/macOS
    dependencies:
      - package: VaultCore
        product: VaultCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonioscirica.hush
        PRODUCT_NAME: Hush
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Firma stabile, non ad-hoc: l'ACL del portachiavi è legata alla firma,
        # e con quella ad-hoc (che cambia a ogni build) macOS vede ogni volta
        # un'app nuova e richiede la password del portachiavi "login".
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: 69SHH7M6DY
        # Runtime irrobustito: senza, qualunque processo dell'utente può
        # attaccare un debugger a Hush e leggersi la master password
        # direttamente dalla memoria. Serve anche per la notarizzazione.
        ENABLE_HARDENED_RUNTIME: YES
        # marca temporale sulla firma: la richiede la notarizzazione
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
      configs:
        Release:
          # Xcode aggiunge da sé com.apple.security.get-task-allow, che
          # rimette in piedi proprio ciò che il runtime irrobustito toglie:
          # con quella entitlement un debugger si attacca lo stesso e legge
          # la master password in memoria. In Debug serve per lo sviluppo,
          # nella build che si distribuisce no.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # Nessuna entitlement -> niente App Sandbox: l'app Mac legge/scrive
    # liberamente il file .kdbx dove lo metti tu (es. iCloud Drive).
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Hush
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© Antonio Scirica"
        CFBundlePackageType: APPL
        # per mandare i cassetti all'iPhone sulla stessa rete, senza server
        NSLocalNetworkUsageDescription: "Hush cerca il tuo iPhone sulla stessa rete WiFi per mandargli i cassetti, senza passare da nessun server."
        NSBonjourServices:
          - _hush-sync._tcp

  Scrigno-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Shared
      - path: App/iOS
    dependencies:
      - package: VaultCore
        product: VaultCore
      - target: ScrignoAutoFill
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonioscirica.hush.ios
        PRODUCT_NAME: Hush
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # firma automatica sul tuo account: serve per installare sul telefono vero
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 69SHH7M6DY
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Hush
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Hush usa Face ID per sbloccare rapidamente il tuo vault."
        # per cercare il Mac sulla stessa rete e ricevere i cassetti, senza server
        NSLocalNetworkUsageDescription: "Hush cerca il tuo Mac sulla stessa rete WiFi per ricevere i cassetti, senza passare da nessun server."
        NSBonjourServices:
          - _hush-sync._tcp
    entitlements:
      path: App/iOS/Scrigno-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.antonioscirica.scrigno
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.antonioscirica.scrigno.shared

  ScrignoAutoFill:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AutoFillExtension
      - path: App/Shared/Persistence
    dependencies:
      - package: VaultCore
        product: VaultCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonioscirica.hush.ios.autofill
        PRODUCT_NAME: ScrignoAutoFill
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 69SHH7M6DY
    info:
      path: AutoFillExtension/Info.plist
      properties:
        CFBundleDisplayName: Hush
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
        NSFaceIDUsageDescription: "Hush usa Face ID per sbloccare rapidamente il tuo vault."
    entitlements:
      path: AutoFillExtension/ScrignoAutoFill.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.antonioscirica.scrigno
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.antonioscirica.scrigno.shared

schemes:
  Scrigno-macOS:
    build:
      targets:
        Scrigno-macOS: all
    run:
      config: Debug
  Scrigno-iOS:
    build:
      targets:
        Scrigno-iOS: all
        ScrignoAutoFill: all
    run:
      config: Debug
