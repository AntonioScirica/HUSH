# Specifica XcodeGen per Scrigno.
#
# Uso: installa XcodeGen una volta (`brew install xcodegen`), poi da questa
# cartella lancia `xcodegen generate` per creare Scrigno.xcodeproj, quindi
# aprilo con Xcode. Vedi ISTRUZIONI.md per i passaggi completi, incluso cosa
# personalizzare (Team ID, bundle identifier, App Group).
#
# Info.plist ed entitlements di ogni target sono generati automaticamente da
# XcodeGen a partire dalle sezioni `info:` / `entitlements:` qui sotto — non
# servono file .plist scritti a mano.

name: Scrigno
options:
  bundleIdPrefix: com.antonioscirica
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: "" # <-- inserisci qui il tuo Team ID (Xcode > Signing & Capabilities)
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "5"

packages:
  VaultCore:
    path: VaultCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4

targets:
  Scrigno-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App/Shared
      - path: App/macOS
    dependencies:
      - package: VaultCore
        product: VaultCore
      - package: Sparkle
        product: Sparkle
      - target: ScrignoSafariExtension
        embed: true
      - target: ScrignoMacAutoFill
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonioscirica.hush
        PRODUCT_NAME: Hush
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Firma stabile, non ad-hoc: l'ACL del portachiavi è legata alla firma,
        # e con quella ad-hoc (che cambia a ogni build) macOS vede ogni volta
        # un'app nuova e richiede la password del portachiavi "login".
        # Automatic invece di Manual: la firma resta comunque quella vera
        # (un certificato Apple, non ad-hoc, sempre lo stesso), ma è Xcode a
        # scegliere/rinnovare il profilo — con Manual, ogni `xcodegen generate`
        # ripartiva da zero e xcodebuild da riga di comando si bloccava
        # chiedendo un profilo che solo l'interfaccia sapeva ritrovare. La
        # firma Developer ID vera per la distribuzione arriva comunque, ma
        # all'esportazione dell'archivio (`-exportOptionsPlist` con
        # `method: developer-id`), non qui.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 69SHH7M6DY
        # Runtime irrobustito: senza, qualunque processo dell'utente può
        # attaccare un debugger a Hush e leggersi la master password
        # direttamente dalla memoria. Serve anche per la notarizzazione.
        ENABLE_HARDENED_RUNTIME: YES
        # marca temporale sulla firma: la richiede la notarizzazione
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
      configs:
        Release:
          # Xcode aggiunge da sé com.apple.security.get-task-allow, che
          # rimette in piedi proprio ciò che il runtime irrobustito toglie:
          # con quella entitlement un debugger si attacca lo stesso e legge
          # la master password in memoria. In Debug serve per lo sviluppo,
          # nella build che si distribuisce no.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # L'app resta senza App Sandbox (legge/scrive liberamente il .kdbx dove
    # lo metti tu, es. iCloud Drive): l'unica entitlement è quella che serve
    # per condividere col Keychain "Data Protection" il token del bridge
    # locale usato dall'estensione Safari (vedi App/macOS/LocalBridge.swift).
    # Non è App Sandbox: quell'entitlement qui non c'è.
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Hush
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© Antonio Scirica"
        CFBundlePackageType: APPL
        # per mandare i cassetti all'iPhone sulla stessa rete, senza server
        NSLocalNetworkUsageDescription: "Hush cerca il tuo iPhone sulla stessa rete WiFi per mandargli i cassetti, senza passare da nessun server."
        NSBonjourServices:
          - _hush-sync._tcp
        # Aggiornamenti automatici (Sparkle): feed e chiave pubblica per
        # verificare che ogni update sia firmato da chi ha la privata (sul
        # Mac di build, nel Keychain — mai nel repo). Vedi ISTRUZIONI.md
        # per come si pubblica una nuova versione.
        SUFeedURL: "https://ndbiydpyjrgflmhtuxuw.supabase.co/storage/v1/object/public/assets/appcast.xml"
        SUPublicEDKey: "MG3Sq4+mqad/IhevSFSj3xupTO14vk2hZSKHcivJilA="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: App/macOS/Scrigno-macOS.entitlements
      properties:
        keychain-access-groups:
          - 69SHH7M6DY.com.antonioscirica.hush.bridge

  Scrigno-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Shared
      - path: App/iOS
    dependencies:
      - package: VaultCore
        product: VaultCore
      - target: ScrignoAutoFill
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonioscirica.hush.ios
        PRODUCT_NAME: Hush
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # firma automatica sul tuo account: serve per installare sul telefono vero
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 69SHH7M6DY
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Hush
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Hush usa Face ID per sbloccare rapidamente il tuo vault."
        # per cercare il Mac sulla stessa rete e ricevere i cassetti, senza server
        NSLocalNetworkUsageDescription: "Hush cerca il tuo Mac sulla stessa rete WiFi per ricevere i cassetti, senza passare da nessun server."
        NSBonjourServices:
          - _hush-sync._tcp
    entitlements:
      path: App/iOS/Scrigno-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.antonioscirica.scrigno
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.antonioscirica.scrigno.shared

  ScrignoAutoFill:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AutoFillExtension
      - path: App/Shared/Persistence
    dependencies:
      - package: VaultCore
        product: VaultCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonioscirica.hush.ios.autofill
        PRODUCT_NAME: ScrignoAutoFill
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 69SHH7M6DY
    info:
      path: AutoFillExtension/Info.plist
      properties:
        CFBundleDisplayName: Hush
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
        NSFaceIDUsageDescription: "Hush usa Face ID per sbloccare rapidamente il tuo vault."
    entitlements:
      path: AutoFillExtension/ScrignoAutoFill.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.antonioscirica.scrigno
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.antonioscirica.scrigno.shared

  ScrignoSafariExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SafariExtension/Native
      - path: SafariExtension/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonioscirica.hush.safariextension
        PRODUCT_NAME: "Hush Safari Extension"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 69SHH7M6DY
        SKIP_INSTALL: YES
        # Richiesto dalla notarizzazione, come sull'app principale.
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: Hush
        CFBundleShortVersionString: "1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    # In sandbox (obbligatorio per le estensioni Safari): niente accesso ai
    # file del vault da qui, solo loopback verso Hush.app e il token nel
    # Keychain condiviso — vedi SafariExtension/Native/BridgeToken.swift.
    entitlements:
      path: SafariExtension/HushSafariExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - 69SHH7M6DY.com.antonioscirica.hush.bridge

  ScrignoMacAutoFill:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MacAutoFillExtension
      - path: AutoFillExtension/AutoFillViewModel.swift
      - path: AutoFillExtension/AutoFillRootView.swift
      - path: App/Shared/Persistence
    dependencies:
      - package: VaultCore
        product: VaultCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonioscirica.hush.autofill
        PRODUCT_NAME: "Hush AutoFill"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 69SHH7M6DY
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        # Legge/scrive nel dominio UserDefaults dell'app principale invece
        # che nel proprio (vuoto) — vedi VaultFileManager.swift.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: MAC_AUTOFILL_EXTENSION
    info:
      path: MacAutoFillExtension/Info.plist
      properties:
        CFBundleDisplayName: Hush
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
        NSFaceIDUsageDescription: "Hush usa Touch ID per sbloccare rapidamente il tuo vault."
    # Niente sandbox, come l'app principale: legge gli stessi file .kdbx
    # dallo stesso posto, senza bisogno di App Group.

schemes:
  Scrigno-macOS:
    build:
      targets:
        Scrigno-macOS: all
        ScrignoSafariExtension: all
        ScrignoMacAutoFill: all
    run:
      config: Debug
  Scrigno-iOS:
    build:
      targets:
        Scrigno-iOS: all
        ScrignoAutoFill: all
    run:
      config: Debug
